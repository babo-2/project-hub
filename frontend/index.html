<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project Hub</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" href="/css/main.css" />
</head>
<body>

<!-- ── Topbar ── -->
<header class="topbar">
    <span class="topbar-logo">Project<span>Hub</span></span>
<div style="display: flex;gap: 12px;align-items: center;">
    <span id="status" style="display: inline-block;width: 6px;height: 6px;border-radius: 50%;margin-right: 8px;animation: blink 1.2s ease-in-out infinite;background: #69F0AE;"></span>
    <button class="btn-icon" id="btn-inbox" title="Inbox">📥</button>
    <div id="login-information">
        {% if username is not none %}
            <span id="current-username" hidden>{{ username }}</span>
            <div class="profile-menu-wrap">
                <button class="btn-ghost profile-btn" id="profile-btn">👤 {{ username }}</button>
                <div class="profile-dropdown" id="profile-dropdown" style="display:none">
                    <button id="profile-settings-btn">⚙ Settings</button>
                    <button id="logout-btn">Logout</button>
                </div>
            </div>
        {% else %}
            <a href="/auth">not logged in - login</a>
        {% endif %}
    </div>
</div>
</header>

<!-- ── Main ── -->
<main class="page-wrapper">
    <div class="page-header">
        <h1>Projects</h1>
        <div class="page-header-actions">
            <button class="btn btn-ghost" id="btn-import">Import</button>
            <input type="file" id="import-input" accept="application/json" hidden />
            <button class="btn btn-primary" id="btn-new-project">+ New project</button>
        </div>
    </div>

    <div class="search-bar">
        <input class="input" id="search-input" type="search" placeholder="Search projects and modules…" />
        <label class="checkbox-label">
            <input type="checkbox" id="search-regex" />
            regex
        </label>
    </div>

    <div id="search-results" hidden></div>

    <div class="project-grid" id="project-grid"></div>

    <div id="empty-state" hidden>
        <p>No projects yet.</p>
        <button class="btn btn-primary" onclick="document.getElementById('btn-new-project').click()">
            Create your first project
        </button>
    </div>
</main>

<!-- ── New Project Modal ── -->
<div class="modal-backdrop" id="project-modal" hidden style="display: none">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div class="modal-header">
            <h2 id="modal-title">New project</h2>
            <button class="btn-icon" id="modal-close" aria-label="Close">✕</button>
        </div>

        <form id="project-form">
            <div class="form-group">
                <label for="proj-name">Name</label>
                <input class="input" id="proj-name" name="name" type="text" placeholder="My awesome project" required />
            </div>
            <div class="form-group">
                <label for="proj-desc">Description</label>
                <input class="input" id="proj-desc" name="description" type="text" placeholder="What is this project about?" />
            </div>
            <div class="form-group">
                <label for="proj-color">Color</label>
                <input class="input" id="proj-color" name="color" type="color" value="#6366f1" />
            </div>

            <div class="modal-footer">
                <button type="button" class="btn btn-ghost" id="modal-cancel" onclick="document.getElementById('modal-close').click()">Cancel</button>
                <button type="submit" class="btn btn-primary">Create project</button>
            </div>
        </form>
    </div>
</div>

<!-- Scripts -->
<script src="/js/utils.js"></script>
<script src="/js/api.js"></script>
<script src="/js/inbox.js"></script>
<script src="/js/profile.js"></script>
<script src="/js/account-settings.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
